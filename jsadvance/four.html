<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM in JavaScript</title>
</head>
<body style="background-color: #212121; color: white;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body> 
<script>

 // ADDITION OF VALUES //

    // METHOD-1 //
    function addLanguage(languageName){
        const li= document.createElement("li")
        li.innerText=`${languageName}`
        // document.querySelector("ul").appendChild(li)
                document.querySelector(".language").appendChild(li)

    }
    addLanguage("python")

    // METHOD-2 // [ MORE OPTIMIZED METHOD ]

 function addOptiLanguage(languageName){
        const li= document.createElement("li");
      
       li.appendChild(document.createTextNode(languageName));
                       document.querySelector(".language").appendChild(li)

      
    }

    addOptiLanguage("ruby");


    // EDITING VALUES // 

    // METHOD-1 //

   const secondLang= document.querySelector('li:nth-child(2)')
const newLi=  document.createElement("li")
newLi.textContent= "Mojo"
secondLang.replaceWith(newLi)

// METHOD - 2//

   const firstlang= document.querySelector('li:first-child')
   firstlang.outerHTML='<li>Typescript</li>'

   // DELETING  //

   const lastLang= document.querySelector('li:last-child')
   lastLang.remove()

</script>
</html>
